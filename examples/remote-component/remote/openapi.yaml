openapi: 3.1.0
info:
  title: Billing API
  version: 1.0.0
servers:
  - url: http://127.0.0.1:4174/api
paths:
  /invoices:
    get:
      operationId: listInvoices
      x-project-id: op-list-invoices
      responses:
        '200':
          description: Invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invoice'
              example:
                - { id: INV-100, total: 42 }
components:
  schemas:
    Invoice:
      x-project-id: schema-invoice
      type: object
      properties:
        id: { type: string }
        total: { type: number }
      required: [id, total]
